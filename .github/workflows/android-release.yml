name: Android signed release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to build and publish
        required: true
        type: string

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 22.17.0
  JAVA_VERSION: 17
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release:
    name: Build, attest and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v${package_version}" != "$RELEASE_TAG" ]]; then
            echo "package.json version ${package_version} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: 8.14.2

      - name: Install locked dependencies
        run: npm ci

      - name: Install required Android SDK packages
        shell: bash
        run: |
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "sdkmanager was not found at $sdkmanager_path." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Add Android platform
        run: npx cordova platform add android@15.0.0

      - name: Configure ephemeral Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required signing secret ${variable_name} is missing." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/nequi-tasks-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          KEYSTORE_PATH="$keystore_path" node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const buildConfiguration = {
            android: {
              release: {
                keystore: process.env.KEYSTORE_PATH,
                storePassword: process.env.ANDROID_KEYSTORE_PASSWORD,
                alias: process.env.ANDROID_KEY_ALIAS,
                password: process.env.ANDROID_KEY_PASSWORD,
                keystoreType: 'pkcs12',
                packageType: 'apk',
              },
            },
          };

          await writeFile('build.json', `${JSON.stringify(buildConfiguration, null, 2)}\n`, {
            mode: 0o600,
          });
          NODE

      - name: Build signed release APK
        run: npm run android:build:release

      - name: Verify APK signature
        shell: pwsh
        run: ./tools/verify-android-release.ps1

      - name: Generate release package, SBOM and checksums
        shell: bash
        run: |
          release_directory='dist/release'
          apk_name="nequi-tasks-${RELEASE_TAG}.apk"
          sbom_name="nequi-tasks-${RELEASE_TAG}.sbom.cdx.json"
          mkdir -p "$release_directory"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk "$release_directory/$apk_name"
          npm sbom --omit=dev --sbom-format=cyclonedx > "$release_directory/$sbom_name"
          (
            cd "$release_directory"
            sha256sum "$apk_name" "$sbom_name" > SHA256SUMS.txt
          )

      - name: Attest APK build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/release/*.apk

      - name: Attest APK SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/release/*.apk
          sbom-path: dist/release/*.sbom.cdx.json

      - name: Upload workflow release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ env.RELEASE_TAG }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mis tareas ${RELEASE_TAG#v}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          rm -f build.json
          rm -f "$RUNNER_TEMP/nequi-tasks-release.p12"
